<div class="bg-white rounded-xl shadow-lg p-6 max-w-lg w-full">
  <h2 class="text-xl font-bold text-gray-800 mb-5">
    {{ editTask ? 'Edit Task' : 'Add New Task' }}
  </h2>
  <form (ngSubmit)="onSubmit()" #taskForm="ngForm">
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
      <input [(ngModel)]="task.title" name="title" required
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        placeholder="Enter task title" />
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <textarea [(ngModel)]="task.description" name="description" rows="3"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        placeholder="Task description..."></textarea>
    </div>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
        <select [(ngModel)]="task.status" name="status"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <option value="pending">Pending</option>
          <option value="in-progress">In Progress</option>
          <option value="completed">Completed</option>
          <option value="overdue">Overdue</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
        <select [(ngModel)]="task.priority" name="priority"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
      <input type="date" [(ngModel)]="task.dueDate" name="dueDate"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
    </div>
    <div class="flex gap-3 justify-end">
      <button type="button" (click)="cancel.emit()"
        class="px-5 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition">
        Cancel
      </button>
      <button type="submit" [disabled]="taskForm.invalid"
        class="px-5 py-2 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition disabled:opacity-50">
        {{ editTask ? 'Update' : 'Add Task' }}
      </button>
    </div>
  </form>
</div>
