<div class="p-6 max-w-7xl mx-auto">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">📊 Dashboard</h1>

  <!-- Stat Cards -->
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
    <div class="bg-white rounded-xl shadow p-4 text-center border-l-4 border-gray-400">
      <p class="text-gray-500 text-sm">Total</p>
      <p class="text-3xl font-bold text-gray-700">{{ stats.total || 0 }}</p>
    </div>
    <div class="bg-white rounded-xl shadow p-4 text-center border-l-4 border-amber-400">
      <p class="text-amber-500 text-sm">Pending</p>
      <p class="text-3xl font-bold text-amber-600">{{ stats.pending || 0 }}</p>
    </div>
    <div class="bg-white rounded-xl shadow p-4 text-center border-l-4 border-blue-400">
      <p class="text-blue-500 text-sm">In Progress</p>
      <p class="text-3xl font-bold text-blue-600">{{ stats.inProgress || 0 }}</p>
    </div>
    <div class="bg-white rounded-xl shadow p-4 text-center border-l-4 border-green-400">
      <p class="text-green-500 text-sm">Completed</p>
      <p class="text-3xl font-bold text-green-600">{{ stats.completed || 0 }}</p>
    </div>
    <div class="bg-white rounded-xl shadow p-4 text-center border-l-4 border-red-400">
      <p class="text-red-500 text-sm">Overdue</p>
      <p class="text-3xl font-bold text-red-600">{{ stats.overdue || 0 }}</p>
    </div>
  </div>

  <!-- Charts Row 1 -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-lg font-semibold text-gray-700 mb-4">Task Status Overview</h2>
      <canvas #statusChart style="max-height:280px;"></canvas>
    </div>
    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-lg font-semibold text-gray-700 mb-4">Tasks by Priority</h2>
      <canvas #priorityChart style="max-height:280px;"></canvas>
    </div>
  </div>

  <!-- Chart Row 2 -->
  <div class="bg-white rounded-xl shadow p-5">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Weekly Trend</h2>
    <canvas #trendChart style="max-height:260px;"></canvas>
  </div>
</div>
